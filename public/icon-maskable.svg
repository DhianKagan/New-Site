      <stop offset="0%" stop-color="#0f3b75" />
      <stop offset="55%" stop-color="#08244b" />
      <stop offset="100%" stop-color="#041329" />
    </linearGradient>
    <radialGradient id="ec-m-glow" cx="256" cy="212" r="185" gradientUnits="userSpaceOnUse">
